server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Lời gọi API chuyển sang container backend (giống proxy của Vite khi phát triển)
    location /api/ {
        client_max_body_size 3m; # tải ảnh đại diện (backend giới hạn 2 MB)
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: đường dẫn không phải file thì trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
