# Chạy toàn bộ hệ thống: docker compose up -d --build  →  mở http://localhost
# Biến môi trường đọc từ file .env ở thư mục gốc (sao chép từ .env.example).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Cần đặt DB_PASSWORD trong file .env}
      MYSQL_DATABASE: ${DB_NAME:-phongkham}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-phongkham}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      CHE_DO_THU: ${CHE_DO_THU:-0}
      DU_LIEU_THU: ${DU_LIEU_THU:-0}
      THU_MUC_TAI_LEN: /app/du-lieu-tai-len
    volumes:
      - tai_len:/app/du-lieu-tai-len

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
  tai_len:
