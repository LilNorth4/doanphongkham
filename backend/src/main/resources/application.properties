spring.application.name=phongkham
server.port=8080

# Đọc thông tin kết nối từ file .env ở thư mục gốc dự án (DB_HOST, DB_PASSWORD...), giống bản cũ
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Hoặc đặt một dòng DATABASE_URL=mysql://USER:PASSWORD@HOST:PORT/DATABASE_NAME (thay cho DB_HOST, DB_USER...)
spring.datasource.url=jdbc:${DATABASE_URL:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:phongkham}?createDatabaseIfNotExist=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Strict mode: dữ liệu sai báo lỗi thay vì bị cắt/đổi ngầm
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode='STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'

# Bảng, trigger do Flyway tạo từ db/migration (V1__tao_bang.sql, V3__trigger.sql); Hibernate không tự tạo/sửa bảng
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Giữ nguyên tên bảng/cột như trong @Table/@Column (MaTK, HoTen...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Chế độ thử: xem OTP/mật khẩu tạm qua /api/dev/hop-thu khi chưa có dịch vụ gửi email.
# Tuyệt đối không bật khi triển khai thật.
phongkham.che-do-thu=${CHE_DO_THU:0}

# Dữ liệu thử: Flyway nạp thêm db/demo/V2__du_lieu_thu.sql (mật khẩu mọi tài khoản: Phongkham123).
# Chỉ có tác dụng ở lần chạy đầu trên CSDL trống.
phongkham.du-lieu-thu=${DU_LIEU_THU:0}

# Ảnh người dùng tải lên (ảnh đại diện), phục vụ lại tại /api/tep/**. Docker gắn volume vào thư mục này.
phongkham.thu-muc-tai-len=${THU_MUC_TAI_LEN:du-lieu-tai-len}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
